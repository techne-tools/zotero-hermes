<linkset>
  <html:link rel="localization" href="hermes-mainWindow.ftl" />
</linkset>
<vbox
  id="hermes-sidebar-container"
  flex="1"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
>
  <!-- Toolbar -->
  <hbox id="hermes-toolbar" class="hermes-toolbar">
    <button
      id="hermes-new-conversation-btn"
      label="New Chat"
      class="hermes-btn-small"
    />
    <button
      id="hermes-export-conversation-btn"
      label="Export"
      class="hermes-btn-small"
    />
    <button
      id="hermes-preferences-btn"
      label="Settings"
      class="hermes-btn-small"
    />
  </hbox>

  <!-- Chat Messages Area -->
  <vbox id="hermes-chat-messages" flex="1" class="hermes-chat-container">
    <html:div id="hermes-messages-list"></html:div>
  </vbox>

  <!-- Context Bar -->
  <hbox id="hermes-context-bar" class="hermes-context-bar" hidden="true">
    <html:div id="hermes-context-items" class="hermes-context-items"></html:div>
    <button
      id="hermes-clear-context-btn"
      label="Clear"
      class="hermes-btn-small"
    />
  </hbox>

  <!-- Feature Toggles Bar -->
  <hbox id="hermes-feature-bar" class="hermes-feature-bar">
    <hbox align="center">
      <checkbox id="hermes-toggle-citations" label="Citations" checked="true" />
      <checkbox
        id="hermes-toggle-annotations"
        label="Annotations"
        checked="true"
      />
      <checkbox id="hermes-toggle-tags" label="Tags" checked="true" />
    </hbox>
  </hbox>

  <!-- Input Area -->
  <hbox class="hermes-input-container">
    <vbox flex="1">
      <html:textarea
        id="hermes-input"
        placeholder="Ask Hermes about your research... (Type /help for commands)"
        rows="3"
        flex="1"
      ></html:textarea>
      <hbox class="hermes-input-actions">
        <button
          id="hermes-attach-btn"
          label="Attach Selected Item"
          class="hermes-btn-secondary"
        />
        <button
          id="hermes-cite-btn"
          label="Cite"
          class="hermes-btn-secondary"
        />
        <button
          id="hermes-annotate-btn"
          label="Annotate"
          class="hermes-btn-secondary"
        />
      </hbox>
    </vbox>
    <button id="hermes-send-btn" label="Send" class="hermes-btn-primary" />
  </hbox>

  <!-- Status Bar -->
  <hbox id="hermes-status-bar" class="hermes-status-bar">
    <html:span id="hermes-connection-status">Disconnected</html:span>
    <html:span id="hermes-token-count"></html:span>
  </hbox>
</vbox>
