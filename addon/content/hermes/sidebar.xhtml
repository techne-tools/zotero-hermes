<linkset>
  <html:link rel="localization" href="hermes-mainWindow.ftl" />
</linkset>
<div
  id="hermes-sidebar-container"
  style="display:flex;flex-direction:column;height:100%;flex:1;min-height:0"
>
  <!-- Header -->
  <div class="hermes-header">
    <div class="hermes-header-title">Hermes AI Chat</div>
    <div class="hermes-header-subtitle">Ask questions about your research</div>
  </div>

  <!-- Toolbar -->
  <div id="hermes-toolbar" class="hermes-toolbar" style="display:flex;flex-direction:row">
    <button
      id="hermes-new-conversation-btn"
      label="New Chat"
      class="hermes-btn-small"
    />
    <button
      id="hermes-export-conversation-btn"
      label="Export"
      class="hermes-btn-small"
    />
    <button
      id="hermes-preferences-btn"
      label="Settings"
      class="hermes-btn-small"
    />
  </div>

  <!-- Chat Messages Area -->
  <div id="hermes-chat-messages" class="hermes-chat-container" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div id="hermes-messages-list"></div>
  </div>

  <!-- Context Bar -->
  <div id="hermes-context-bar" class="hermes-context-bar" style="display:none">
    <div id="hermes-context-items" class="hermes-context-items"></div>
    <button
      id="hermes-clear-context-btn"
      label="Clear"
      class="hermes-btn-small"
    />
  </div>

  <!-- Feature Toggles Bar -->
  <div id="hermes-feature-bar" class="hermes-feature-bar" style="display:flex;flex-direction:row">
    <div style="display:flex;flex-direction:row;align-items:center">
      <label class="hermes-checkbox-label">
        <input type="checkbox" id="hermes-toggle-citations" checked="true" />
        Citations
      </label>
      <label class="hermes-checkbox-label">
        <input type="checkbox" id="hermes-toggle-annotations" checked="true" />
        Annotations
      </label>
      <label class="hermes-checkbox-label">
        <input type="checkbox" id="hermes-toggle-tags" checked="true" />
        Tags
      </label>
    </div>
  </div>

  <!-- Input Area -->
  <div class="hermes-input-container" style="display:flex;flex-direction:row">
    <div style="display:flex;flex-direction:column;flex:1">
      <textarea
        id="hermes-input"
        placeholder="Ask Hermes about your research... (Type /help for commands)"
        rows="3"
        style="flex:1"
      ></textarea>
      <div class="hermes-input-actions" style="display:flex;flex-direction:row">
        <button
          id="hermes-attach-btn"
          label="Attach Selected Item"
          class="hermes-btn-secondary"
        />
        <button
          id="hermes-cite-btn"
          label="Cite"
          class="hermes-btn-secondary"
        />
        <button
          id="hermes-annotate-btn"
          label="Annotate"
          class="hermes-btn-secondary"
        />
      </div>
    </div>
    <button id="hermes-send-btn" label="Send" class="hermes-btn-primary" />
  </div>

  <!-- Status Bar -->
  <div id="hermes-status-bar" class="hermes-status-bar" style="display:flex;flex-direction:row">
    <span id="hermes-connection-status">Disconnected</span>
    <span id="hermes-token-count"></span>
  </div>
</div>
