<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <!-- 🤖 Agent Personality -->
  <groupbox>
    <label><html:h2>🤖 Agent Personality</html:h2></label>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-chat-agent-name"
      >What you call your assistant in the chat</html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-chat-agent-name"
        preference="extensions.zotero.hermes.chatAgentName"
        placeholder="Hermes"
        style="flex: 1;"
      ></html:input>
    </hbox>
  </groupbox>

  <!-- 💬 Chat Display -->
  <groupbox>
    <label><html:h2>💬 Chat Display</html:h2></label>

    <checkbox
      id="zotero-prefpane-__addonRef__-show-reasoning"
      preference="extensions.zotero.hermes.showReasoning"
      label="Show Reasoning Steps — display the agent's chain-of-thought"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-show-tool-use"
      preference="extensions.zotero.hermes.showToolUse"
      label="Show Tool Use — display a notice when the agent reads files or runs commands"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-show-token-count"
      preference="extensions.zotero.hermes.showTokenCount"
      label="Show Token Count — display real-time token usage in chat"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-auto-save"
      preference="extensions.zotero.hermes.autoSave"
      label="Auto-Save Conversations"
    />
  </groupbox>

  <!-- 🔌 Connection -->
  <groupbox>
    <label><html:h2>🔌 Connection</html:h2></label>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-connection-mode"
      >How Hermes connects to your AI agent</html:label>
      <menulist
        id="zotero-prefpane-__addonRef__-connection-mode"
        preference="extensions.zotero.hermes.connectionMode"
      >
        <menupopup>
          <menuitem label="Local — runs on this computer" value="stdio" />
          <menuitem label="Remote — connects to a server" value="api" />
        </menupopup>
      </menulist>
    </hbox>

    <hbox align="center" id="__addonRef__-binary-path-row">
      <html:label
        for="zotero-prefpane-__addonRef__-binary-path"
      >Hermes program location (leave blank for auto-detect)</html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-binary-path"
        preference="extensions.zotero.hermes.binaryPath"
        placeholder="/opt/homebrew/bin/hermes"
        style="flex: 1;"
      ></html:input>
    </hbox>

    <hbox align="center" id="__addonRef__-api-url-row">
      <html:label
        for="zotero-prefpane-__addonRef__-api-url"
      >Server address</html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-api-url"
        preference="extensions.zotero.hermes.apiUrl"
        placeholder="http://localhost:8642"
        style="flex: 1;"
      ></html:input>
    </hbox>

    <hbox align="center" id="__addonRef__-api-key-row">
      <html:label
        for="zotero-prefpane-__addonRef__-api-key"
      >API key (stored securely)</html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-api-key"
        preference="extensions.zotero.hermes.apiKey"
        style="flex: 1;"
      ></html:input>
    </hbox>
  </groupbox>

  <!-- 🛡️ Security -->
  <groupbox>
    <label><html:h2>🛡️ Security</html:h2></label>

    <checkbox
      id="zotero-prefpane-__addonRef__-enable-citations"
      preference="extensions.zotero.hermes.enableCitations"
      label="Enable citation generation"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-enable-annotations"
      preference="extensions.zotero.hermes.enableAnnotations"
      label="Enable annotation reading"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-enable-tags"
      preference="extensions.zotero.hermes.enableTags"
      label="Enable tag management"
    />
  </groupbox>

  <!-- 🐛 Troubleshooting -->
  <groupbox>
    <label><html:h2>🐛 Troubleshooting</html:h2></label>

    <checkbox
      id="zotero-prefpane-__addonRef__-enable-debug-mode"
      preference="extensions.zotero.hermes.enableDebugMode"
      label="Debug Mode — write detailed logs to the browser console"
    />
  </groupbox>

  <!-- ℹ️ About -->
  <vbox>
    <html:label
      data-l10n-id="pref-help"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    ></html:label>
  </vbox>
</vbox>
