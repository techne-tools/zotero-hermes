<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <!-- Connection Settings -->
  <groupbox>
    <label><html:h2 data-l10n-id="pref-connection-title"></html:h2></label>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-connection-mode"
        data-l10n-id="pref-connection-mode"
      ></html:label>
      <menulist
        id="zotero-prefpane-__addonRef__-connection-mode"
        preference="extensions.zotero.hermes.connectionMode"
      >
        <menupopup>
          <menuitem label="ACP (stdio subprocess)" value="stdio" />
          <menuitem label="API Server (HTTP)" value="api" />
        </menupopup>
      </menulist>
    </hbox>

    <hbox align="center" id="__addonRef__-binary-path-row">
      <html:label
        for="zotero-prefpane-__addonRef__-binary-path"
        data-l10n-id="pref-binary-path"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-binary-path"
        preference="extensions.zotero.hermes.binaryPath"
        style="flex: 1;"
      ></html:input>
    </hbox>

    <hbox align="center" id="__addonRef__-api-url-row">
      <html:label
        for="zotero-prefpane-__addonRef__-api-url"
        data-l10n-id="pref-api-url"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-api-url"
        preference="extensions.zotero.hermes.apiUrl"
        placeholder="http://localhost:8642"
        style="flex: 1;"
      ></html:input>
    </hbox>

    <hbox align="center" id="__addonRef__-api-key-row">
      <html:label
        for="zotero-prefpane-__addonRef__-api-key"
        data-l10n-id="pref-api-key"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-api-key"
        preference="extensions.zotero.hermes.apiKey"
        style="flex: 1;"
      ></html:input>
    </hbox>
  </groupbox>

  <!-- General Settings -->
  <groupbox>
    <label><html:h2 data-l10n-id="pref-general-title"></html:h2></label>

    <checkbox
      id="zotero-prefpane-__addonRef__-auto-save"
      preference="extensions.zotero.hermes.autoSave"
      data-l10n-id="pref-auto-save"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-show-reasoning"
      preference="extensions.zotero.hermes.showReasoning"
      data-l10n-id="pref-show-reasoning"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-enable-citations"
      preference="extensions.zotero.hermes.enableCitations"
      data-l10n-id="pref-enable-citations"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-enable-annotations"
      preference="extensions.zotero.hermes.enableAnnotations"
      data-l10n-id="pref-enable-annotations"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-enable-tags"
      preference="extensions.zotero.hermes.enableTags"
      data-l10n-id="pref-enable-tags"
    />
  </groupbox>

  <!-- Help / About -->
  <vbox>
    <html:label
      data-l10n-id="pref-help"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    ></html:label>
  </vbox>
</vbox>
